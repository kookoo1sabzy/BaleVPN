name: Node binaries

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.suffix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   suffix: macos-arm64, ext: '' }
          - { os: macos-13,       suffix: macos-x64,   ext: '' }
          - { os: ubuntu-latest,  suffix: linux-x64,   ext: '' }
          - { os: windows-latest, suffix: win-x64,     ext: '.exe' }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: bale-vpn-node
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: bale-vpn-node/package-lock.json

      - name: Derive version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: npm ci

      # node-datachannel is a native addon — it ships prebuilt binaries via
      # @mapbox/node-pre-gyp. On the very first `npm ci` the prebuilt for the
      # current host platform is fetched automatically. No manual build-tun
      # step is needed for node-datachannel itself.
      #
      # The TUN kernel module (tun_addon) is still built on Linux only.
      - name: Build TUN addon (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: npm run build-tun

      - name: Package binary
        run: |
          npx pkg . \
            --target node18-${{ matrix.suffix }} \
            --output dist/balevpn-${{ steps.ver.outputs.version }}-${{ matrix.suffix }}${{ matrix.ext }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: balevpn-${{ matrix.suffix }}
          path: bale-vpn-node/dist/balevpn-${{ steps.ver.outputs.version }}-${{ matrix.suffix }}${{ matrix.ext }}
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bale-vpn-node/dist/balevpn-${{ steps.ver.outputs.version }}-${{ matrix.suffix }}${{ matrix.ext }}
